services:

  app:
    build:
      context: .
      args:
        GO_VERSION: ${GO_VERSION}
        ALPINE_VERSION: ${ALPINE_VERSION}
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=appuser
      - DB_PASSWORD=secret
      - DB_NAME=video_commerce
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:${POSTGRES_VERSION}
    environment:
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=video_commerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d video_commerce"]
      interval: 5s
      retries: 5

volumes:
  postgres_data:
