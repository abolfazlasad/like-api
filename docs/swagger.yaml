basePath: /api/v1
definitions:
  main.LikePostRequest:
    properties:
      post_id:
        example: post1
        type: string
      user_id:
        example: user1
        type: string
    required:
    - post_id
    - user_id
    type: object
  main.Response:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  main.UnlikePostRequest:
    properties:
      post_id:
        example: post1
        type: string
      user_id:
        example: user1
        type: string
    required:
    - post_id
    - user_id
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for liking posts with predefined users and posts
  title: Like API
  version: "1.0"
paths:
  /likes:
    delete:
      consumes:
      - application/json
      description: Remove like from a post
      parameters:
      - description: Unlike request
        in: body
        name: unlike
        required: true
        schema:
          $ref: '#/definitions/main.UnlikePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.Response'
      summary: Unlike a post
      tags:
      - likes
    post:
      consumes:
      - application/json
      description: Like a specific post as a user
      parameters:
      - description: Like request
        in: body
        name: like
        required: true
        schema:
          $ref: '#/definitions/main.LikePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/main.Response'
      summary: Like a post
      tags:
      - likes
  /posts:
    get:
      consumes:
      - application/json
      description: Get list of all posts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Response'
      summary: Get all posts
      tags:
      - posts
  /posts/{post_id}/likes:
    get:
      consumes:
      - application/json
      description: Get all likes for a specific post
      parameters:
      - description: Post ID
        in: path
        name: post_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.Response'
      summary: Get likes for a post
      tags:
      - likes
  /users:
    get:
      consumes:
      - application/json
      description: Get list of all predefined users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Response'
      summary: Get all users
      tags:
      - users
  /users/{user_id}/liked-posts:
    get:
      consumes:
      - application/json
      description: Get all posts liked by a specific user
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.Response'
      summary: Get user's liked posts
      tags:
      - likes
  /users/{user_id}/posts:
    get:
      consumes:
      - application/json
      description: Get all posts from a specific user
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.Response'
      summary: Get posts by user
      tags:
      - posts
swagger: "2.0"
